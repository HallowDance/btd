[package]
name = "btd"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
pipewire = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "6.3.0", default-features = false, features = ["proxy", "service", "tokio"] }
zlink = { version = "0.9.0", default-features = false, features = ["tokio", "service", "proxy", "tracing"] }
