[package]
name = "btd"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/HallowDance/btd"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
futures-util = "0.3.34"
pipewire = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "6.3.0", default-features = false, features = ["proxy", "service", "tokio"] }
zlink = { version = "0.9.0", default-features = false, features = ["tokio", "service", "proxy", "tracing"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
